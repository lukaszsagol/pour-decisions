<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = this.fresh();
  }

  fresh() {
    var u = function (c, h) { return { c: c, h: !!h }; };
    return {
      tubes: [
        { u: [u('umeshu'), u('sakura'), u('melon'), u('ramune')], keep: null },
        { u: [u('sakura'), u('ramune'), u('umeshu'), u('yuzu')], keep: null },
        { u: [u('melon', true), u('yuzu', true), u('sakura'), u('umeshu')], keep: null },
        { u: [u('ramune'), u('melon'), u('yuzu'), u('yuzu')], keep: null },
        { u: [u('umeshu'), u('sakura'), u('melon'), u('ramune')], keep: null },
        { u: [], keep: 'yuzu' },
        { u: [], keep: null }
      ],
      selected: null,
      moves: 0,
      history: [],
      undos: 5,
      glasses: 2,
      hints: 3,
      extra: false,
      won: false,
      stuck: false,
      hint: null,
      reject: null,
      msg: 'Tap a glass, then tap where to pour it'
    };
  }

  get DRINKS() {
    return {
      umeshu: { bg: '#C7772E', name: 'Umeshu' },
      sakura: { bg: '#F49AC1', name: 'Sakura' },
      melon: { bg: '#3ECF7A', name: 'Melon soda' },
      yuzu: { bg: '#F5D547', name: 'Yuzu' },
      ramune: { bg: '#5EC3F0', name: 'Ramune' }
    };
  }

  clone(tubes) { return JSON.parse(JSON.stringify(tubes)); }
  top(t) { return t.u.length ? t.u[t.u.length - 1] : null; }
  run(t) {
    var n = 0, c = this.top(t) ? this.top(t).c : null;
    for (var i = t.u.length - 1; i >= 0; i--) { if (t.u[i].c === c && !t.u[i].h) { n++; } else { break; } }
    return n;
  }
  complete(t) {
    if (t.u.length !== 4) { return false; }
    for (var i = 0; i < 4; i++) { if (t.u[i].h || t.u[i].c !== t.u[0].c) { return false; } }
    return true;
  }
  legal(tubes, a, b) {
    if (a === b) { return false; }
    var A = tubes[a], B = tubes[b];
    if (!A.u.length || B.u.length >= 4) { return false; }
    var c = this.top(A).c;
    if (B.keep && B.keep !== c) { return false; }
    if (B.u.length && this.top(B).c !== c) { return false; }
    return true;
  }
  anyMove(tubes) {
    for (var a = 0; a < tubes.length; a++) {
      for (var b = 0; b < tubes.length; b++) {
        if (this.legal(tubes, a, b) && !this.complete(tubes[a])) { return true; }
      }
    }
    return false;
  }
  reveal(tubes) {
    tubes.forEach(function (t) { if (t.u.length) { t.u[t.u.length - 1].h = false; } });
  }
  isWon(tubes) {
    var self = this;
    return tubes.every(function (t) { return t.u.length === 0 || self.complete(t); });
  }

  pour(a, b) {
    var s = this.state;
    var tubes = this.clone(s.tubes);
    var n = Math.min(this.run(tubes[a]), 4 - tubes[b].u.length);
    for (var k = 0; k < n; k++) { tubes[b].u.push(tubes[a].u.pop()); }
    this.reveal(tubes);
    var won = this.isWon(tubes);
    this.setState({
      tubes: tubes,
      history: s.history.concat([s.tubes]),
      moves: s.moves + 1,
      selected: null,
      hint: null,
      won: won,
      stuck: !won && !this.anyMove(tubes),
      msg: ''
    });
  }

  tap(i) {
    var s = this.state;
    if (s.won) { return; }
    if (s.selected === null) {
      if (s.tubes[i].u.length) { this.setState({ selected: i, msg: '' }); }
      return;
    }
    if (s.selected === i) { this.setState({ selected: null }); return; }
    if (this.legal(s.tubes, s.selected, i)) { this.pour(s.selected, i); return; }
    var self = this;
    var from = s.selected;
    this.setState({ reject: i, selected: from, msg: '' });
    clearTimeout(this.rejectTimer);
    this.rejectTimer = setTimeout(function () { self.setState({ reject: null }); }, 420);
  }

  componentWillUnmount() { clearTimeout(this.rejectTimer); }

  undo() {
    var s = this.state;
    if (!s.history.length) { this.setState({ msg: 'Nothing to undo yet' }); return; }
    if (s.undos <= 0) { this.setState({ msg: 'No undos left' }); return; }
    var prev = s.history[s.history.length - 1];
    this.setState({ tubes: prev, history: s.history.slice(0, -1), undos: s.undos - 1, selected: null, hint: null, stuck: false, msg: 'Undone. Moves still count.' });
  }

  addGlass() {
    var s = this.state;
    if (s.extra) { this.setState({ msg: 'One extra glass per level' }); return; }
    if (s.glasses <= 0) { this.setState({ msg: 'No extra glasses left' }); return; }
    var tubes = this.clone(s.tubes);
    tubes.push({ u: [], keep: null });
    this.setState({ tubes: tubes, glasses: s.glasses - 1, extra: true, stuck: false, selected: null, msg: 'Extra glass added. Best score is now 2 stars.' });
  }

  useHint() {
    var s = this.state;
    if (s.won) { return; }
    if (s.hints <= 0) { this.setState({ msg: 'No hints left' }); return; }
    var t = s.tubes, best = null, fallback = null;
    for (var a = 0; a < t.length; a++) {
      if (this.complete(t[a])) { continue; }
      for (var b = 0; b < t.length; b++) {
        if (!this.legal(t, a, b)) { continue; }
        if (t[b].u.length) { if (!best) { best = { a: a, b: b }; } }
        else if (this.run(t[a]) < t[a].u.length && !fallback) { fallback = { a: a, b: b }; }
      }
    }
    var h = best || fallback;
    if (!h) { this.setState({ msg: 'No useful pour. Try undo.' }); return; }
    this.setState({ hint: h, hints: s.hints - 1, selected: null, msg: 'Pour glass ' + (h.a + 1) + ' into glass ' + (h.b + 1) });
  }

  restart() { this.setState(this.fresh()); }

  renderVals() {
    var s = this.state, self = this, DRINKS = this.DRINKS, BEST = 16;
    var tubes = s.tubes.map(function (t, i) {
      var hinted = s.hint && (s.hint.a === i || s.hint.b === i);
      var rejected = s.reject === i;
      var ring = rejected ? '#E0453A' : (s.selected === i ? '#FF5C8A' : (hinted ? '#5EC3F0' : (t.keep ? '#F5D547' : '#5B66A6')));
      var units = t.u.map(function (x) {
        return { bg: x.h ? '#1E2652' : DRINKS[x.c].bg, border: 'none', hidden: x.h };
      });
      if (t.keep) {
        for (var g = t.u.length; g < 4; g++) {
          units.push({ bg: 'rgba(245, 213, 71, 0.08)', border: '2px dashed rgba(245, 213, 71, 0.55)', hidden: false });
        }
      }
      var desc = t.u.length ? t.u.map(function (x) { return x.h ? 'hidden' : DRINKS[x.c].name; }).reverse().join(', ') : 'empty';
      return {
        tap: function () { self.tap(i); },
        label: 'Glass ' + (i + 1) + ', top to bottom: ' + desc + (t.keep ? ', ' + DRINKS[t.keep].name + ' only' : ''),
        lift: s.selected === i ? -16 : 0,
        anim: rejected ? 'pd-shake 360ms ease-in-out' : 'none',
        ring: ring,
        glassBg: rejected ? '#2A1020' : '#0F1538',
        isKeep: !!t.keep,
        units: units
      };
    });
    var stars = 1;
    if (s.moves <= Math.floor(BEST * 1.1)) { stars = 3; } else if (s.moves <= Math.floor(BEST * 1.35)) { stars = 2; }
    if (s.extra && stars > 2) { stars = 2; }
    var verdicts = { 1: 'Cleared', 2: 'Nicely poured', 3: s.moves <= BEST ? 'Perfect pour' : 'Superb pour' };
    if (s.moves < BEST) { verdicts[3] = 'You beat the computer'; }
    return {
      tubes: tubes,
      moves: s.moves,
      msg: s.msg,
      undos: s.undos,
      glasses: s.glasses,
      hints: s.hints,
      stuck: s.stuck,
      won: s.won,
      verdict: verdicts[stars],
      star1: '#F4B860',
      star2: stars >= 2 ? '#F4B860' : '#2B3466',
      star3: stars >= 3 ? '#F4B860' : '#2B3466',
      undo: function () { self.undo(); },
      addGlass: function () { self.addGlass(); },
      useHint: function () { self.useHint(); },
      restart: function () { self.restart(); }
    };
  }
}
</script>
</body>
</html>
